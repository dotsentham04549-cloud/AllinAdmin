<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ALL IN · Смена</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F1216">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ALL IN">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');

:root{
  --ink:#0F1216;
  --panel:#171B21;
  --panel2:#1F242C;
  --line:#2B313B;
  --text:#EDEFF2;
  --muted:#89919E;
  --amber:#F5A524;
  --green:#3FC77F;
  --red:#FF5F6D;
  --blue:#5AA9FF;
  --r:12px;
  --safe:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--ink);color:var(--text)}
body{
  font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:15px;line-height:1.45;
  padding-bottom:calc(74px + var(--safe));min-height:100vh;
}
.disp{font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:.01em;text-transform:uppercase}
.num{font-family:'Oswald',sans-serif;font-weight:600;font-variant-numeric:tabular-nums}
.wrap{max-width:820px;margin:0 auto;padding:0 14px}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:40;background:rgba(15,18,22,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.htop{display:flex;align-items:center;gap:12px;padding:12px 0}
.logo{width:34px;height:34px;border-radius:9px;background:var(--amber);color:#141414;display:grid;place-items:center;font-family:'Oswald';font-weight:700;font-size:15px;flex:none}
.hname{flex:1;min-width:0}
.hname b{font-family:'Oswald';font-weight:600;font-size:17px;letter-spacing:.02em;text-transform:uppercase;display:block}
.hname span{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.icobtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);display:grid;place-items:center;cursor:pointer;flex:none;font-size:17px}
.icobtn:active{background:var(--line)}
#dot{width:7px;height:7px;border-radius:50%;background:transparent;transition:background .3s}
#dot.on{background:var(--green)}
#dot.err{background:var(--red)}

/* ---------- generic ---------- */
.sect{margin:20px 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sect h2{font-family:'Oswald';font-weight:600;font-size:13px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.sect .act{font-size:13px;color:var(--amber);cursor:pointer;font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}
.empty b{display:block;color:var(--text);font-family:'Oswald';font-weight:500;font-size:15px;letter-spacing:.02em;margin-bottom:4px;text-transform:uppercase}
.row{display:flex;gap:10px}
.grow{flex:1;min-width:0}
.mut{color:var(--muted)}
.sm{font-size:13px}
.xs{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.rt{text-align:right}
.nowrap{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- shift meter (signature) ---------- */
.meter{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:14px}
.meter .day{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.meter .day b{font-family:'Oswald';font-weight:500;font-size:15px;letter-spacing:.04em;text-transform:uppercase}
.gauges{display:grid;grid-template-columns:repeat(3,1fr)}
.gauge{padding:14px;border-right:1px solid var(--line)}
.gauge:last-child{border-right:0}
.gauge .v{font-family:'Oswald';font-weight:600;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.gauge .k{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-top:5px;font-weight:600}
.gauge.acc .v{color:var(--amber)}
.gauge.dbt .v{color:var(--red)}

/* ---------- job card (signature) ---------- */
.job{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px 13px 17px;margin-bottom:9px;cursor:pointer;overflow:hidden}
.job:before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--muted)}
.job.s-plan:before{background:var(--blue)}
.job.s-work:before{background:var(--amber)}
.job.s-done:before{background:var(--green)}
.job.s-out:before{background:#4A515C}
.job .jh{display:flex;align-items:flex-start;gap:10px}
.job .time{font-family:'Oswald';font-weight:600;font-size:16px;color:var(--amber);flex:none;width:46px;font-variant-numeric:tabular-nums}
.job .car{font-family:'Oswald';font-weight:500;font-size:16px;letter-spacing:.02em}
.job .cli{font-size:13px;color:var(--muted)}
.job .srv{font-size:13.5px;margin-top:7px;color:#C9CFD8}
.job .sum{font-family:'Oswald';font-weight:600;font-size:16px;font-variant-numeric:tabular-nums;flex:none}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 7px;border-radius:5px;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.tag.debt{background:rgba(255,95,109,.12);color:var(--red);border-color:rgba(255,95,109,.3)}
.tag.ok{background:rgba(63,199,127,.12);color:var(--green);border-color:rgba(63,199,127,.3)}

/* ---------- task ---------- */
.task{display:flex;gap:11px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px;margin-bottom:8px}
.chk{width:21px;height:21px;border-radius:6px;border:1.5px solid var(--line);flex:none;cursor:pointer;display:grid;place-items:center;font-size:13px;color:transparent;margin-top:1px}
.chk.on{background:var(--green);border-color:var(--green);color:#0F1216}
.task.done .tx{text-decoration:line-through;color:var(--muted)}
.task .od{color:var(--red);font-weight:600}

/* ---------- forms ---------- */
label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 5px}
input,select,textarea{
  width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);
  border-radius:9px;padding:11px 12px;font-family:inherit;font-size:16px;outline:none
}
input:focus,select:focus,textarea:focus{border-color:var(--amber)}
textarea{resize:vertical;min-height:64px;font-size:15px}
.f{margin-bottom:13px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{
  display:block;width:100%;padding:13px;border:0;border-radius:10px;background:var(--amber);color:#141414;
  font-family:'Oswald';font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer
}
.btn:active{filter:brightness(.92)}
.btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.btn.dang{background:transparent;color:var(--red);border:1px solid rgba(255,95,109,.35)}
.btn.sm{padding:9px;font-size:13px}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:var(--amber);color:#141414;border-color:var(--amber)}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;display:none}
.scrim.on{display:block}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--panel);
  border-top:1px solid var(--line);border-radius:18px 18px 0 0;
  max-height:92vh;overflow-y:auto;transform:translateY(100%);transition:transform .22s ease;
  padding-bottom:calc(20px + var(--safe))
}
.sheet.on{transform:translateY(0)}
.sheet-in{max-width:820px;margin:0 auto;padding:0 16px}
.sh{position:sticky;top:0;background:var(--panel);padding:14px 0 12px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);margin-bottom:16px;z-index:2}
.sh h3{font-family:'Oswald';font-weight:600;font-size:17px;letter-spacing:.03em;text-transform:uppercase;flex:1}
.grab{width:38px;height:4px;border-radius:3px;background:var(--line);margin:8px auto 0}

/* ---------- nav ---------- */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(15,18,22,.95);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);display:flex;padding-bottom:var(--safe)
}
nav button{
  flex:1;background:none;border:0;color:var(--muted);padding:9px 2px 8px;cursor:pointer;
  font-family:'Oswald';font-size:10.5px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;
  display:flex;flex-direction:column;align-items:center;gap:3px
}
nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--amber)}
.fab{
  position:fixed;right:16px;bottom:calc(86px + var(--safe));z-index:45;width:54px;height:54px;border-radius:16px;
  background:var(--amber);color:#141414;border:0;font-size:28px;font-weight:300;cursor:pointer;
  box-shadow:0 8px 24px rgba(0,0,0,.45);display:grid;place-items:center;line-height:1
}
.qrow{display:flex;gap:8px;margin-top:14px}
.qb{width:50px;flex:none;border:0;border-radius:9px;background:var(--amber);color:#141414;font-size:26px;font-weight:300;cursor:pointer;line-height:1}
.bar{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--amber);border-radius:3px}
.bar i.g{background:var(--green)}
.srow{padding:10px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.lrow{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:7px;cursor:pointer}
.lrow .lt{font-family:'Oswald';font-weight:600;font-size:13px;color:var(--muted);width:42px;flex:none;font-variant-numeric:tabular-nums}
.list{margin-top:2px}
hr.d{border:0;border-top:1px solid var(--line);margin:16px 0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv b{font-family:'Oswald';font-weight:600;font-variant-numeric:tabular-nums;font-size:15px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="wrap htop">
    <div class="logo">AI</div>
    <div class="hname"><b id="hTitle">Смена</b><span id="hSub">ALL IN · Воронеж</span></div>
    <div id="dot"></div>
    <button class="icobtn" id="btnMenu">⋯</button>
  </div>
</header>

<main class="wrap" id="app"></main>

<button class="fab" id="fab">+</button>

<nav id="nav"></nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div class="sheet-in" id="sheetIn"></div></div>

<script>
/* ============ storage ============ */
const KEY='allin:studio:v1';
const DEF={orders:[],clients:[],tasks:[],expenses:[],income:[],leads:[],masters:['Кирчанов Денис','Денис Маслов','Максим Мозгов','Артем Сердюков','Солодин Сергей','Владислав Меркулов','Козленко Вадим']};
let DB=JSON.parse(JSON.stringify(DEF));
let TAB='shift', LOADED=false;

const hasStore = typeof window.storage!=='undefined' && window.storage;
function dot(cls){const d=document.getElementById('dot');d.className=cls||'';if(cls==='on')setTimeout(()=>{d.className=''},1400)}
function lsGet(){try{return localStorage.getItem(KEY)}catch(e){return null}}
function lsSet(v){try{localStorage.setItem(KEY,v);return true}catch(e){return false}}

async function load(){
  let raw=null;
  if(hasStore){try{const r=await window.storage.get(KEY);if(r&&r.value)raw=r.value}catch(e){}}
  if(!raw)raw=lsGet();
  if(raw){try{DB=Object.assign(JSON.parse(JSON.stringify(DEF)),JSON.parse(raw))}catch(e){}}
  LOADED=true;
}
let st;
function save(){
  clearTimeout(st);
  st=setTimeout(async()=>{
    const v=JSON.stringify(DB);
    let ok=lsSet(v);
    if(hasStore){try{await window.storage.set(KEY,v);ok=true}catch(e){}}
    dot(ok?'on':'err');
  },350);
}

/* ============ utils ============ */
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Math.round(Number(n)||0).toLocaleString('ru-RU')+' ₽';
const num=n=>Math.round(Number(n)||0).toLocaleString('ru-RU');
function iso(d){const t=new Date(d);t.setMinutes(t.getMinutes()-t.getTimezoneOffset());return t.toISOString().slice(0,10)}
const TODAY=()=>iso(new Date());
function shiftDays(isoStr,n){const d=new Date(isoStr+'T12:00');d.setDate(d.getDate()+n);return iso(d)}
const MON=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const DOW=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
function human(isoStr){const d=new Date(isoStr+'T12:00');return d.getDate()+' '+MON[d.getMonth()]}
function humanFull(isoStr){const d=new Date(isoStr+'T12:00');return d.getDate()+' '+MON[d.getMonth()]+', '+DOW[d.getDay()]}
const digits=p=>String(p||'').replace(/\D/g,'');
const phoneKey=p=>digits(p).slice(-10);
function fmtPhone(p){const d=phoneKey(p);if(d.length!==10)return p||'';return '+7 '+d.slice(0,3)+' '+d.slice(3,6)+'-'+d.slice(6,8)+'-'+d.slice(8)}

const STATUS={plan:'Записан',work:'В работе',done:'Готов',out:'Выдан'};
const paidSum=o=>(o.pay||[]).reduce((s,p)=>s+(Number(p.sum)||0),0);
const debt=o=>Math.max(0,(Number(o.total)||0)-paidSum(o));

/* ============ nav ============ */
const TABS=[
  {k:'shift',t:'Смена',i:'<path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/><circle cx="12" cy="12" r="3.2"/>'},
  {k:'leads',t:'Заявки',i:'<path d="M6.5 3.5l2.6 4-2 2a13 13 0 006.4 6.4l2-2 4 2.6v3.2c0 .9-.8 1.5-1.7 1.4C9.6 20.2 3.8 14.4 3 5.2 2.9 4.3 3.5 3.5 4.4 3.5z"/>'},
  {k:'sched',t:'Записи',i:'<rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/>'},
  {k:'money',t:'Деньги',i:'<rect x="2.5" y="6" width="19" height="13" rx="2.5"/><circle cx="12" cy="12.5" r="2.6"/><path d="M6 6V4.5h12V6"/>'},
  {k:'cli',t:'Клиенты',i:'<circle cx="12" cy="8" r="3.6"/><path d="M4.5 20a7.5 7.5 0 0115 0"/>'}
];
function drawNav(){
  $('#nav').innerHTML=TABS.map(t=>`<button data-tab="${t.k}" class="${TAB===t.k?'on':''}"><svg viewBox="0 0 24 24">${t.i}</svg>${t.t}</button>`).join('');
}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b){TAB=b.dataset.tab;render()}});

/* ============ sheet ============ */
function openSheet(html){
  $('#sheetIn').innerHTML=html;
  bindChipsAll($('#sheetIn'));
  $('#scrim').classList.add('on');$('#sheet').classList.add('on');
}
function closeSheet(){$('#scrim').classList.remove('on');$('#sheet').classList.remove('on')}
$('#scrim').addEventListener('click',closeSheet);
function sheetHead(title){return `<div class="sh"><h3>${esc(title)}</h3><button class="icobtn" onclick="closeSheet()">✕</button></div>`}

/* чипы: один выбранный в группе */
function chipGroup(id,arr,cur){return `<div class="chips" id="${id}">${arr.map(v=>`<div class="chip ${v===cur?'on':''}" data-v="${esc(v)}">${esc(v)}</div>`).join('')}</div>`}
function chipVal(id,def){const b=document.getElementById(id);if(!b)return def;const c=b.querySelector('.chip.on');return c?c.dataset.v:def}
function bindChipsAll(root){
  root.querySelectorAll('.chips[id]').forEach(b=>{
    if(b.dataset.b)return;b.dataset.b='1';
    b.addEventListener('click',e=>{const c=e.target.closest('.chip');if(!c||!c.dataset.v)return;
      [...b.children].forEach(x=>x.classList.remove('on'));c.classList.add('on')});
  });
}

/* ============ клиенты ============ */
function upsertClient(name,phone,car,plate){
  const k=phoneKey(phone);
  if(!k&&!name)return null;
  let c=DB.clients.find(x=>k&&phoneKey(x.phone)===k);
  if(!c){c={id:uid(),name:name||'',phone:phone||'',car:car||'',plate:plate||'',note:'',since:TODAY()};DB.clients.push(c)}
  else{if(name)c.name=name;if(car)c.car=car;if(plate)c.plate=plate}
  return c;
}
const clientOrders=c=>DB.orders.filter(o=>phoneKey(o.phone)&&phoneKey(o.phone)===phoneKey(c.phone)).sort((a,b)=>b.date.localeCompare(a.date));

/* ============ ЗАКАЗ: форма ============ */
function orderForm(id,pre){
  const o=id?DB.orders.find(x=>x.id===id):null;
  const d=o||Object.assign({date:TODAY(),time:'',name:'',phone:'',car:'',plate:'',services:'',total:'',status:'plan',note:'',work:[],pay:[]},pre||{});
  const mopts=DB.masters.map(m=>`<option value="${esc(m)}">${esc(m)}</option>`).join('');
  openSheet(sheetHead(o?'Заказ':'Новая запись')+`
    <div class="f2"><div class="f"><label>Дата</label><input type="date" id="fDate" value="${d.date}"></div>
    <div class="f"><label>Время</label><input type="time" id="fTime" value="${esc(d.time)}"></div></div>
    <div class="f"><label>Клиент</label><input id="fName" value="${esc(d.name)}" placeholder="Имя"></div>
    <div class="f"><label>Телефон</label><input id="fPhone" type="tel" inputmode="tel" value="${esc(d.phone)}" placeholder="+7 900 000-00-00"></div>
    <div class="f2"><div class="f"><label>Авто</label><input id="fCar" value="${esc(d.car)}" placeholder="BMW X5"></div>
    <div class="f"><label>Госномер</label><input id="fPlate" value="${esc(d.plate)}" placeholder="А123ВС"></div></div>
    <div class="f"><label>Услуги</label><textarea id="fSrv" placeholder="Полировка + керамика">${esc(d.services)}</textarea></div>
    <div class="f"><label>Стоимость, ₽</label><input id="fTotal" type="number" inputmode="numeric" value="${d.total}" placeholder="34900"></div>
    <div class="f"><label>Статус</label><div class="chips" id="fStatus">
      ${Object.entries(STATUS).map(([k,v])=>`<div class="chip ${d.status===k?'on':''}" data-v="${k}">${v}</div>`).join('')}
    </div></div>
    <div class="f"><label>Мастера и их доля, ₽</label><div id="fWork">
      ${(d.work||[]).map(w=>workRow(w.master,w.sum,mopts)).join('')}
    </div><button class="btn ghost sm" style="margin-top:8px" onclick="addWork()">+ мастер</button></div>
    <div class="f"><label>Заметка</label><textarea id="fNote" placeholder="Что важно помнить">${esc(d.note)}</textarea></div>
    <button class="btn" onclick="saveOrder(${o?"'"+o.id+"'":'null'})">Сохранить</button>
    ${o?`<button class="btn dang sm" style="margin-top:10px" onclick="delOrder('${o.id}')">Удалить заказ</button>`:''}
    <div style="height:14px"></div>
  `);
  $('#fStatus').addEventListener('click',e=>{const c=e.target.closest('.chip');if(!c)return;
    [...$('#fStatus').children].forEach(x=>x.classList.remove('on'));c.classList.add('on')});
  if(!(d.work||[]).length&&!o)addWork();
}
function workRow(m,s,mopts){
  const opts=mopts||DB.masters.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');
  return `<div class="row" style="margin-bottom:8px">
    <select class="grow wm"><option value="">— мастер —</option>${opts}</select>
    <input class="ws" type="number" inputmode="numeric" style="width:100px" placeholder="₽" value="${s==null?'':s}">
  </div>`.replace(`value="${esc(m||'')}"`,'');
}
function addWork(){
  const box=$('#fWork');const div=document.createElement('div');div.innerHTML=workRow('','');
  box.appendChild(div.firstElementChild);
}
function readWork(){
  const rows=[...$('#fWork').querySelectorAll('.row')];
  return rows.map(r=>({master:r.querySelector('.wm').value,sum:Number(r.querySelector('.ws').value)||0}))
             .filter(w=>w.master);
}
function saveOrder(id){
  const o=id?DB.orders.find(x=>x.id===id):{id:uid(),pay:[]};
  o.date=$('#fDate').value||TODAY();
  o.time=$('#fTime').value;
  o.name=$('#fName').value.trim();
  o.phone=$('#fPhone').value.trim();
  o.car=$('#fCar').value.trim();
  o.plate=$('#fPlate').value.trim().toUpperCase();
  o.services=$('#fSrv').value.trim();
  o.total=Number($('#fTotal').value)||0;
  o.status=($('#fStatus').querySelector('.chip.on')||{dataset:{v:'plan'}}).dataset.v;
  o.work=readWork();
  o.note=$('#fNote').value.trim();
  if(!o.car&&!o.name){alert('Впиши хотя бы авто или имя клиента');return}
  if(!id)DB.orders.push(o);
  upsertClient(o.name,o.phone,o.car,o.plate);
  save();closeSheet();render();
}
function delOrder(id){
  if(!confirm('Удалить заказ? Это уберёт его из кассы и зарплаты.'))return;
  DB.orders=DB.orders.filter(x=>x.id!==id);save();closeSheet();render();
}

  return `<div class="job s-${o.status}" data-o="${o.id}">

      <div class="grow">
        <div class="car nowrap">${esc(o.car||o.name||'Заказ')}</div>
        <div class="cli nowrap">${esc(o.name)}${o.plate?' · '+esc(o.plate):''}</div>
      </div>
      <div class="sum">${num(o.total)}</div>
    </div>
    ${o.services?`<div class="srv nowrap">${esc(o.services)}</div>`:''}
    <div class="row" style="margin-top:9px;gap:6px;align-items:center">
      <span class="tag">${STATUS[o.status]}</span>
      ${dg>0?`<span class="tag debt">долг ${num(dg)} ₽</span>`:`<span class="tag ok">оплачен</span>`}

      <div class="kv"><span class="mut">Когда</span><b>${human(o.date)}${o.time?', '+esc(o.time):''}</b></div>
      <div class="kv"><span class="mut">Клиент</span><b>${esc(o.name||'—')}</b></div>
      ${o.phone?`<div class="kv"><span class="mut">Телефон</span><b>${esc(fmtPhone(o.phone))}</b></div>`:''}
      ${o.plate?`<div class="kv"><span class="mut">Госномер</span><b>${esc(o.plate)}</b></div>`:''}
      <div class="kv"><span class="mut">Стоимость</span><b>${money(o.total)}</b></div>
      <div class="kv"><span class="mut">Получено</span><b style="color:var(--green)">${money(pd)}</b></div>
      ${dg>0?`<div class="kv"><span class="mut">Долг</span><b style="color:var(--red)">${money(dg)}</b></div>`:''}
    </div>
    ${o.services?`<div class="card" style="margin-top:10px"><div class="xs">Услуги</div><div style="margin-top:6px">${esc(o.services)}</div></div>`:''}
    ${o.note?`<div class="card" style="margin-top:10px"><div class="xs">Заметка</div><div style="margin-top:6px">${esc(o.note)}</div></div>`:''}
    ${(o.work||[]).length?`<div class="card" style="margin-top:10px"><div class="xs">Мастера</div>
      ${o.work.map(w=>`<div class="kv"><span>${esc(w.master)}</span><b>${money(w.sum)}</b></div>`).join('')}</div>`:''}
    <div class="sect"><h2>Статус</h2></div>
    <div class="chips">${Object.entries(STATUS).map(([k,v])=>`<div class="chip ${o.status===k?'on':''}" onclick="setStatus('${o.id}','${k}')">${v}</div>`).join('')}</div>
    <div class="sect"><h2>Действия</h2></div>
    ${o.phone?`<div class="row" style="margin-bottom:10px">
      <a class="btn ghost sm grow" style="text-decoration:none;text-align:center;line-height:1.9" href="tel:+7${phoneKey(o.phone)}">Позвонить</a>
      <a class="btn ghost sm grow" style="text-decoration:none;text-align:center;line-height:1.9" href="https://wa.me/7${phoneKey(o.phone)}" target="_blank" rel="noopener">WhatsApp</a>
    </div>`:''}
    ${dg>0?`<button class="btn" onclick="payForm('${o.id}')">Принять оплату</button>`:''}
    <button class="btn ghost" style="margin-top:10px" onclick="orderForm('${o.id}')">Изменить заказ</button>

  `);

function setStatus(id,s){const o=DB.orders.find(x=>x.id===id);if(!o)return;o.status=s;save();openOrder(id);render()}
function payForm(id){
  const o=DB.orders.find(x=>x.id===id);
  openSheet(sheetHead('Оплата')+`
    <div class="f"><label>Сумма, ₽</label><input id="pSum" type="number" inputmode="numeric" value="${debt(o)}"></div>
    <div class="f"><label>Как заплатили</label><div class="chips" id="pM">
      ${['Наличные','Карта','Перевод'].map((m,i)=>`<div class="chip ${i===0?'on':''}" data-v="${m}">${m}</div>`).join('')}
    </div></div>
    <button class="btn" onclick="addPay('${id}')">Записать в кассу</button><div style="height:14px"></div>`);
  $('#pM').addEventListener('click',e=>{const c=e.target.closest('.chip');if(!c)return;
    [...$('#pM').children].forEach(x=>x.classList.remove('on'));c.classList.add('on')});
}
function addPay(id){
  const o=DB.orders.find(x=>x.id===id);
  const s=Number($('#pSum').value)||0;if(s<=0){alert('Впиши сумму');return}
  o.pay=o.pay||[];
  o.pay.push({sum:s,method:($('#pM').querySelector('.chip.on')||{dataset:{v:'Наличные'}}).dataset.v,date:TODAY()});
  save();openOrder(id);render();
}

  const tx=$('#tTx').value.trim();if(!tx){alert('Впиши, что сделать');return}
  DB.tasks.push({id:uid(),text:tx,date:$('#tDt').value||TODAY(),done:false});
  save();closeSheet();render();
}
function toggleTask(id){const t=DB.tasks.find(x=>x.id===id);if(t){t.done=!t.done;save();render()}}
function delTask(id){DB.tasks=DB.tasks.filter(x=>x.id!==id);save();render()}
function taskRow(t){
  const over=!t.done&&t.date<TODAY();
  return `<div class="task ${t.done?'done':''}">
    <div class="chk ${t.done?'on':''}" onclick="toggleTask('${t.id}')">✓</div>
    <div class="grow"><div class="tx">${esc(t.text)}</div>
      <div class="sm ${over?'od':'mut'}" style="margin-top:2px">${over?'просрочено · ':''}${human(t.date)}</div></div>
    <button class="icobtn" style="width:30px;height:30px;font-size:13px" onclick="delTask('${t.id}')">✕</button>
  </div>`;
}

/* ============ экраны ============ */
function viewShift(){
  const t=TODAY();
  const todays=DB.orders.filter(o=>o.date===t).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));
  const gotToday=DB.orders.reduce((s,o)=>s+(o.pay||[]).filter(p=>p.date===t).reduce((x,p)=>x+p.sum,0),0);
  const debtAll=DB.orders.filter(o=>o.status!=='plan').reduce((s,o)=>s+debt(o),0);
  const tasks=DB.tasks.filter(x=>!x.done&&x.date<=t).sort((a,b)=>a.date.localeCompare(b.date));
  const ready=DB.orders.filter(o=>o.status==='done');
  const tomorrow=DB.orders.filter(o=>o.date===shiftDays(t,1));
  const lt=DB.leads.filter(l=>l.date===t);
  const leadsToday=lt.length, leadsWon=lt.filter(l=>l.res==='Записался').length;

  return `
  <div class="meter">
    <div class="day"><b>${humanFull(t)}</b><span class="xs">Смена</span></div>
    <div class="gauges">
      <div class="gauge"><div class="v">${todays.length}</div><div class="k">машин сегодня</div></div>
      <div class="gauge acc"><div class="v">${num(gotToday)}</div><div class="k">получено, ₽</div></div>
      <div class="gauge ${debtAll?'dbt':''}"><div class="v">${num(debtAll)}</div><div class="k">не оплачено, ₽</div></div>
    </div>
  </div>

  ${deferredPrompt&&!standalone()?`<button class="btn" style="margin-top:14px" onclick="doInstall()">Установить приложение</button>`:''}
  <div class="qrow">
    <input id="qi" placeholder="Быстро: «завтра позвонить Сергею»" onkeydown="if(event.key==='Enter')quickAdd()">
    <button class="qb" onclick="quickAdd()">+</button>
  </div>
  <div class="chips" style="margin-top:8px">
    <div class="chip" onclick="leadForm()">+ звонок</div>
    <div class="chip" onclick="orderForm()">+ запись</div>
    <div class="chip" onclick="taskForm()">+ дело на дату</div>
  </div>
  <div class="sm mut" style="margin-top:9px">Заявок сегодня: <b class="num">${leadsToday}</b> · записались: <b class="num">${leadsWon}</b></div>

  <div class="sect"><h2>Сегодня в работе</h2><span class="act" onclick="orderForm()">+ запись</span></div>
  <div class="list">${todays.length?todays.map(orderCard).join(''):'<div class="empty"><b>На сегодня пусто</b>Добавь первую запись — она сама попадёт в кассу и историю клиента</div>'}</div>

  ${ready.length?`<div class="sect"><h2>Готовы к выдаче — позвонить</h2></div>
    <div class="list">${ready.map(orderCard).join('')}</div>`:''}

  <div class="sect"><h2>Напомнить</h2><span class="act" onclick="taskForm()">+ дело</span></div>
  <div class="list">${tasks.length?tasks.map(taskRow).join(''):'<div class="empty"><b>Дел на сегодня нет</b>Добавь то, что боишься забыть</div>'}</div>

  ${tomorrow.length?`<div class="sect"><h2>Завтра</h2></div><div class="list">${tomorrow.map(orderCard).join('')}</div>`:''}
  <div style="height:20px"></div>`;
}

let schedFrom=null;
function viewSched(){
  const base=schedFrom||TODAY();
  const days=[];for(let i=0;i<7;i++)days.push(shiftDays(base,i));
  const byDay=days.map(d=>{
    const list=DB.orders.filter(o=>o.date===d).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));
    if(!list.length)return '';
    const sum=list.reduce((s,o)=>s+(Number(o.total)||0),0);
    return `<div class="sect"><h2>${humanFull(d)}</h2><span class="xs">${num(sum)} ₽ · ${list.length}</span></div>
            <div class="list">${list.map(orderCard).join('')}</div>`;
  }).join('');
  const later=DB.orders.filter(o=>o.date>days[6]).sort((a,b)=>a.date.localeCompare(b.date));
  return `
  <div class="row" style="margin-top:14px;gap:8px">
    <button class="btn ghost sm grow" onclick="schedFrom='${shiftDays(base,-7)}';render()">← неделя</button>
    <button class="btn ghost sm grow" onclick="schedFrom=null;render()">Сегодня</button>
    <button class="btn ghost sm grow" onclick="schedFrom='${shiftDays(base,7)}';render()">неделя →</button>
  </div>
  ${byDay||'<div class="empty" style="margin-top:16px"><b>На эту неделю записей нет</b>Листай вперёд или добавь запись кнопкой +</div>'}
  ${later.length?`<div class="sect"><h2>Дальше</h2></div><div class="list">${later.map(orderCard).join('')}</div>`:''}
  <div style="height:20px"></div>`;
}

let cashFrom=null,cashTo=null;
function viewCash(){
  const from=cashFrom||TODAY().slice(0,8)+'01', to=cashTo||TODAY();
  let cash=0,card=0,tr=0,total=0;
  const rows=[];
  DB.orders.forEach(o=>(o.pay||[]).forEach(p=>{
    if(p.date>=from&&p.date<=to){
      total+=p.sum;
      if(p.method==='Наличные')cash+=p.sum;else if(p.method==='Карта')card+=p.sum;else tr+=p.sum;
      rows.push({date:p.date,sum:p.sum,method:p.method,what:o.car||o.name||'Заказ'});
    }
  }));
  const exps=DB.expenses.filter(e=>e.date>=from&&e.date<=to);
  const expSum=exps.reduce((s,e)=>s+(Number(e.sum)||0),0);
  DB.income.filter(i=>i.date>=from&&i.date<=to).forEach(i=>{
    const s=Number(i.sum)||0;total+=s;
    if(i.method==='Наличные')cash+=s;else if(i.method==='Карта')card+=s;else tr+=s;
    rows.push({date:i.date,sum:s,method:i.method,what:i.what,id:i.id,manual:true});
  });
  rows.sort((a,b)=>b.date.localeCompare(a.date));
  return `
  <div class="f2" style="margin-top:14px">
    <div class="f"><label>с</label><input type="date" value="${from}" onchange="cashFrom=this.value;render()"></div>
    <div class="f"><label>по</label><input type="date" value="${to}" onchange="cashTo=this.value;render()"></div>
  </div>
  <div class="meter">
    <div class="day"><b>Итог</b><span class="xs">${human(from)} — ${human(to)}</span></div>
    <div class="gauges">
      <div class="gauge acc"><div class="v">${num(total)}</div><div class="k">приход, ₽</div></div>
      <div class="gauge dbt"><div class="v">${num(expSum)}</div><div class="k">расход, ₽</div></div>
      <div class="gauge"><div class="v">${num(total-expSum)}</div><div class="k">разница, ₽</div></div>
    </div>
  </div>
  <div class="card" style="margin-top:10px">
    <div class="kv"><span class="mut">Наличные</span><b>${money(cash)}</b></div>
    <div class="kv"><span class="mut">Карта</span><b>${money(card)}</b></div>
    <div class="kv"><span class="mut">Перевод</span><b>${money(tr)}</b></div>
  </div>
  <div class="sect"><h2>Расходы</h2><span class="act" onclick="expForm()">+ расход</span></div>
  <div class="list">${exps.length?exps.sort((a,b)=>b.date.localeCompare(a.date)).map(e=>`
    <div class="task"><div class="grow"><div>${esc(e.what)}</div><div class="sm mut">${human(e.date)}</div></div>
    <b class="num" style="color:var(--red)">−${num(e.sum)}</b>
    <button class="icobtn" style="width:30px;height:30px;font-size:13px" onclick="delExp('${e.id}')">✕</button></div>`).join('')
    :'<div class="empty"><b>Расходов нет</b>Химия, материалы, мойка — записывай сюда</div>'}</div>
  <div class="sect"><h2>Приход</h2><span class="act" onclick="incForm()">+ приход</span></div>
  <div class="list">${rows.length?rows.map(r=>`
    <div class="task"><div class="grow"><div>${esc(r.what)}</div><div class="sm mut">${human(r.date)} · ${esc(r.method)}${r.manual?' · вручную':''}</div></div>
    <b class="num" style="color:var(--green)">+${num(r.sum)}</b>
    ${r.manual?`<button class="icobtn" style="width:30px;height:30px;font-size:13px" onclick="delInc('${r.id}')">✕</button>`:''}</div>`).join('')
    :'<div class="empty"><b>Приходов за период нет</b>Оплата заказа попадает сюда сама, когда жмёшь «Принять оплату». Всё остальное — сертификаты, доплаты, мелочь — кнопкой «+ приход»</div>'}</div>
  <div style="height:20px"></div>`;
}

let payFrom=null,payTo=null;
function viewPay(){
  const from=payFrom||TODAY().slice(0,8)+'01', to=payTo||TODAY();
  const per={};let orders=0,rev=0;
  DB.orders.filter(o=>o.date>=from&&o.date<=to).forEach(o=>{
    orders++;rev+=Number(o.total)||0;
    (o.work||[]).forEach(w=>{
      if(!per[w.master])per[w.master]={sum:0,n:0,list:[]};
      per[w.master].sum+=Number(w.sum)||0;per[w.master].n++;
      per[w.master].list.push({car:o.car||o.name,date:o.date,sum:w.sum});
    });
  });
  const admin=Math.round(rev*0.05);
  const names=Object.keys(per).sort((a,b)=>per[b].sum-per[a].sum);
  return `
  <div class="f2" style="margin-top:14px">
    <div class="f"><label>с</label><input type="date" value="${from}" onchange="payFrom=this.value;render()"></div>
    <div class="f"><label>по</label><input type="date" value="${to}" onchange="payTo=this.value;render()"></div>
  </div>
  <div class="meter">
    <div class="day"><b>Период</b><span class="xs">${human(from)} — ${human(to)}</span></div>
    <div class="gauges">
      <div class="gauge"><div class="v">${orders}</div><div class="k">заказов</div></div>
      <div class="gauge acc"><div class="v">${num(rev)}</div><div class="k">выручка, ₽</div></div>
      <div class="gauge"><div class="v">${num(admin)}</div><div class="k">админ 5%, ₽</div></div>
    </div>
  </div>
  <div class="sect"><h2>По мастерам</h2></div>
  <div class="list">${names.length?names.map(n=>`
    <div class="job" onclick="masterCard('${esc(n).replace(/'/g,'')}')">
      <div class="jh"><div class="grow"><div class="car">${esc(n)}</div><div class="cli">${per[n].n} заказ(ов)</div></div>
      <div class="sum" style="color:var(--amber)">${num(per[n].sum)}</div></div>
    </div>`).join('')
  :'<div class="empty"><b>Долей пока нет</b>Открой заказ и впиши, сколько на нём заработал мастер</div>'}</div>
  <div class="sm mut" style="margin-top:14px">Доли ставишь ты в каждом заказе — приложение ничего не считает за тебя, только складывает. 5% админа показаны отдельно, из долей не вычитаются.</div>
  <div style="height:20px"></div>`;
}
function masterCard(name){
  const from=payFrom||TODAY().slice(0,8)+'01', to=payTo||TODAY();
  const rows=[];let sum=0;
  DB.orders.filter(o=>o.date>=from&&o.date<=to).forEach(o=>(o.work||[]).forEach(w=>{
    if(w.master===name){rows.push({car:o.car||o.name,date:o.date,sum:w.sum});sum+=Number(w.sum)||0}
  }));
  rows.sort((a,b)=>b.date.localeCompare(a.date));
  openSheet(sheetHead(name)+`
    <div class="card"><div class="kv"><span class="mut">За период</span><b style="color:var(--amber)">${money(sum)}</b></div>
    <div class="kv"><span class="mut">Заказов</span><b>${rows.length}</b></div></div>
    <div class="sect"><h2>Заказы</h2></div>
    ${rows.map(r=>`<div class="kv"><span>${esc(r.car)} <span class="mut sm">· ${human(r.date)}</span></span><b>${money(r.sum)}</b></div>`).join('')}
    <div style="height:20px"></div>`);
}

let cliQ='';
function viewCli(){
  const q=cliQ.toLowerCase().trim();
  let list=DB.clients.slice();
  if(q)list=list.filter(c=>(c.name||'').toLowerCase().includes(q)||digits(c.phone).includes(digits(q))||(c.car||'').toLowerCase().includes(q)||(c.plate||'').toLowerCase().includes(q));
  const stat=c=>{const os=clientOrders(c);return{n:os.length,sum:os.reduce((s,o)=>s+(Number(o.total)||0),0),last:os[0]?os[0].date:c.since}};
  list.sort((a,b)=>stat(b).last.localeCompare(stat(a).last));
  return `
  <div class="f" style="margin-top:14px"><input placeholder="Имя, телефон, авто или номер" value="${esc(cliQ)}" oninput="cliQ=this.value;renderSoft()" id="cq"></div>
  <div class="sect"><h2>Клиенты · ${DB.clients.length}</h2></div>
  <div class="list">${list.length?list.map(c=>{const s=stat(c);const cold=s.last<shiftDays(TODAY(),-60);
    return `<div class="job" onclick="openCli('${c.id}')">
      <div class="jh"><div class="grow">
        <div class="car nowrap">${esc(c.name||fmtPhone(c.phone))}</div>
        <div class="cli nowrap">${esc(c.car||'')}${c.plate?' · '+esc(c.plate):''}</div>
      </div><div class="rt"><div class="sum">${num(s.sum)}</div><div class="cli">${s.n} визит(ов)</div></div></div>
      ${cold?'<div class="row" style="margin-top:8px"><span class="tag debt">не был с '+human(s.last)+'</span></div>':''}
    </div>`}).join('')
    :'<div class="empty"><b>Пока пусто</b>Клиенты появляются сами, когда ты создаёшь запись с телефоном</div>'}</div>
  <div style="height:20px"></div>`;
}
function openCli(id){
  const c=DB.clients.find(x=>x.id===id);if(!c)return;
  const os=clientOrders(c);const sum=os.reduce((s,o)=>s+(Number(o.total)||0),0);
  openSheet(sheetHead(c.name||fmtPhone(c.phone))+`
    <div class="card">
      ${c.phone?`<div class="kv"><span class="mut">Телефон</span><b>${esc(fmtPhone(c.phone))}</b></div>`:''}
      ${c.car?`<div class="kv"><span class="mut">Авто</span><b>${esc(c.car)}</b></div>`:''}
      ${c.plate?`<div class="kv"><span class="mut">Госномер</span><b>${esc(c.plate)}</b></div>`:''}
      <div class="kv"><span class="mut">Визитов</span><b>${os.length}</b></div>
      <div class="kv"><span class="mut">Всего оставил</span><b style="color:var(--amber)">${money(sum)}</b></div>
    </div>
    ${c.phone?`<div class="row" style="margin-top:12px">
      <a class="btn ghost sm grow" style="text-decoration:none;text-align:center;line-height:1.9" href="tel:+7${phoneKey(c.phone)}">Позвонить</a>
      <a class="btn ghost sm grow" style="text-decoration:none;text-align:center;line-height:1.9" href="https://wa.me/7${phoneKey(c.phone)}" target="_blank" rel="noopener">WhatsApp</a></div>`:''}
    <div class="f" style="margin-top:14px"><label>Заметка о клиенте</label>
      <textarea id="cn" placeholder="Ездит на работу далеко, любит матовую керамику">${esc(c.note||'')}</textarea></div>
    <button class="btn ghost sm" onclick="saveCliNote('${c.id}')">Сохранить заметку</button>
    <div class="sect"><h2>История</h2></div>
    <div class="list">${os.length?os.map(orderCard).join(''):'<div class="empty"><b>Заказов ещё нет</b></div>'}</div>
    <div style="height:20px"></div>`);
}
function saveCliNote(id){const c=DB.clients.find(x=>x.id===id);c.note=$('#cn').value.trim();save();dot('on');closeSheet()}

/* ============ меню ============ */
$('#btnMenu').addEventListener('click',()=>{
  openSheet(sheetHead('Настройки')+`
    <div class="sect" style="margin-top:0"><h2>Мастера</h2></div>
    <div class="f"><textarea id="mList" style="min-height:120px">${esc(DB.masters.join('\n'))}</textarea>
      <div class="sm mut" style="margin-top:6px">По одному в строке</div></div>
    <button class="btn ghost sm" onclick="saveMasters()">Сохранить список</button>
    <div class="sect"><h2>Проверка установки</h2></div>
    <div class="card"><div id="diag" class="sm">Проверяю…</div></div>
    <div class="sect"><h2>Резервная копия</h2></div>
    <button class="btn ghost" onclick="expJSON()">Скачать все данные</button>
    <div style="height:10px"></div>
    <label style="margin-bottom:6px">Загрузить из файла</label>
    <input type="file" accept="application/json" id="impF" onchange="impJSON(event)">
    <div class="sm mut" style="margin-top:10px">Данные хранятся в твоём аккаунте Claude и открываются одинаково на телефоне и на компьютере. Копию делай раз в неделю.</div>
    <div style="height:20px"></div>`);
  runDiag();
});
async function runDiag(){
  const el=document.getElementById('diag');if(!el)return;
  const line=(ok,t)=>`<div style="padding:4px 0;color:${ok?'var(--green)':'var(--red)'}">${ok?'✓':'✕'} <span style="color:var(--text)">${t}</span></div>`;
  let out='';
  out+=line(location.protocol==='https:','Адрес по https');
  let sw=false,ctrl=false;
  if('serviceWorker' in navigator){
    try{const r=await navigator.serviceWorker.getRegistration();sw=!!r;ctrl=!!navigator.serviceWorker.controller}catch(e){}
  }
  out+=line(sw,'Офлайн-модуль зарегистрирован');
  out+=line(ctrl,'Офлайн-модуль управляет страницей');
  let man=false,ico=false;
  try{const r=await fetch('manifest.json',{cache:'no-store'});man=r.ok;if(man){const j=await r.json();const i=await fetch(j.icons[0].src,{cache:'no-store'});ico=i.ok}}catch(e){}
  out+=line(man,'Манифест читается');
  out+=line(ico,'Иконка загружается');
  out+=line(standalone(),'Запущено как приложение');
  out+=line(!!deferredPrompt||standalone(),'Chrome готов установить');
  out+=`<div class="mut" style="margin-top:8px">Если всё зелёное, кроме последних двух — перезапусти вкладку. Если красный «офлайн-модуль» — файл sw.js лежит не рядом с index.html.</div>`;
  el.innerHTML=out;
}
function saveMasters(){DB.masters=$('#mList').value.split('\n').map(s=>s.trim()).filter(Boolean);save();closeSheet();render()}
function expJSON(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='allin-'+TODAY()+'.json';a.click();
}
function impJSON(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const p=JSON.parse(r.result);DB=Object.assign(JSON.parse(JSON.stringify(DEF)),p);save();closeSheet();render();alert('Загружено')}catch(err){alert('Файл не читается')}};
  r.readAsText(f);
}

/* ============ быстрая заметка ============ */
function quickAdd(){
  const el=$('#qi');if(!el)return;
  let t=el.value.trim();if(!t)return;
  let d=TODAY();const low=t.toLowerCase();
  if(low.startsWith('завтра ')){d=shiftDays(TODAY(),1);t=t.slice(7).trim()}
  else if(low.startsWith('послезавтра ')){d=shiftDays(TODAY(),2);t=t.slice(12).trim()}
  else if(low.startsWith('через неделю ')){d=shiftDays(TODAY(),7);t=t.slice(13).trim()}
  if(!t)return;
  DB.tasks.push({id:uid(),text:t,date:d,done:false});
  save();render();
  const n=$('#qi');if(n)n.focus();
}

/* ============ заявки и звонки ============ */
const SRC=['Звонок','WhatsApp','Авито','Яндекс','Instagram','Пришёл сам','Знакомые'];
const SRV=['Полировка','Химчистка','Керамика','Оклейка','Мойка','Кожа','Тонировка','Другое'];
const RES=['Записался','Думает','Дорого','Не дозвонился','Не наша услуга'];

function leadForm(id){
  const l=id?DB.leads.find(x=>x.id===id):null;
  const now=new Date().toTimeString().slice(0,5);
  const d=l||{date:TODAY(),time:now,src:'Звонок',srv:'',res:'Думает',phone:'',name:'',note:''};
  openSheet(sheetHead(l?'Заявка':'Новая заявка')+`
    <div class="f"><label>Откуда</label>${chipGroup('lSrc',SRC,d.src)}</div>
    <div class="f"><label>Что спрашивал</label>${chipGroup('lSrv',SRV,d.srv)}</div>
    <div class="f"><label>Чем кончилось</label>${chipGroup('lRes',RES,d.res)}</div>
    <div class="f2"><div class="f"><label>Телефон</label><input id="lPh" type="tel" inputmode="tel" value="${esc(d.phone)}"></div>
    <div class="f"><label>Имя</label><input id="lNm" value="${esc(d.name)}"></div></div>
    <div class="f2"><div class="f"><label>Дата</label><input id="lDt" type="date" value="${d.date}"></div>
    <div class="f"><label>Время</label><input id="lTm" type="time" value="${esc(d.time)}"></div></div>
    <div class="f"><label>Заметка</label><input id="lNo" value="${esc(d.note)}" placeholder="Просил скинуть цену в WhatsApp"></div>
    <button class="btn" onclick="saveLead(${l?"'"+l.id+"'":'null'})">Сохранить</button>
    ${l?`<button class="btn dang sm" style="margin-top:10px" onclick="delLead('${l.id}')">Удалить</button>`:''}
    <div style="height:14px"></div>`);
}
function saveLead(id){
  const l=id?DB.leads.find(x=>x.id===id):{id:uid()};
  l.src=chipVal('lSrc','Звонок');l.srv=chipVal('lSrv','');l.res=chipVal('lRes','Думает');
  l.phone=$('#lPh').value.trim();l.name=$('#lNm').value.trim();
  l.date=$('#lDt').value||TODAY();l.time=$('#lTm').value;l.note=$('#lNo').value.trim();
  if(!id)DB.leads.push(l);
  save();closeSheet();render();
  if(l.res==='Записался'&&confirm('Создать запись на этого клиента?'))
    orderForm(null,{name:l.name,phone:l.phone,services:l.srv});
}
function delLead(id){DB.leads=DB.leads.filter(x=>x.id!==id);save();closeSheet();render()}
function quickLead(){
  DB.leads.push({id:uid(),date:TODAY(),time:new Date().toTimeString().slice(0,5),
    src:chipVal('qSrc','Звонок'),srv:chipVal('qSrv',''),res:chipVal('qRes','Думает'),
    phone:($('#qPh')?$('#qPh').value.trim():''),name:'',note:''});
  save();render();
}

let leadFrom=null,leadTo=null;
function viewLeads(){
  const from=leadFrom||TODAY().slice(0,8)+'01', to=leadTo||TODAY();
  const list=DB.leads.filter(l=>l.date>=from&&l.date<=to).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
  const won=list.filter(l=>l.res==='Записался').length;
  const conv=list.length?Math.round(won/list.length*100):0;
  const group=(key)=>{const m={};list.forEach(l=>{const k=l[key]||'—';if(!m[k])m[k]={n:0,w:0};m[k].n++;if(l.res==='Записался')m[k].w++});return m};
  const bySrc=group('src'),bySrv=group('srv'),byRes=group('res');
  const maxN=Math.max(1,...Object.values(bySrc).map(x=>x.n));
  const block=(m,withConv)=>Object.entries(m).sort((a,b)=>b[1].n-a[1].n).map(([k,v])=>`
    <div class="srow"><div class="row"><span class="grow">${esc(k)}</span>
      <b class="num">${v.n}</b>${withConv?`<span class="sm mut" style="width:66px;text-align:right">${v.n?Math.round(v.w/v.n*100):0}% зап.</span>`:''}</div>
      <div class="bar"><i style="width:${Math.round(v.n/maxN*100)}%"></i></div></div>`).join('');

  return `
  <div class="card" style="margin-top:14px">
    <div class="xs">Быстро записать звонок</div>
    <div style="margin-top:9px">${chipGroup('qSrc',SRC,'Звонок')}</div>
    <div style="margin-top:7px">${chipGroup('qSrv',SRV,'')}</div>
    <div style="margin-top:7px">${chipGroup('qRes',RES,'Думает')}</div>
    <div class="qrow"><input id="qPh" type="tel" inputmode="tel" placeholder="Телефон — если оставил"><button class="qb" onclick="quickLead()">+</button></div>
    <div class="sm mut" style="margin-top:8px">Три тапа и плюс. Подробности можно дописать позже — нажми на строку в журнале.</div>
  </div>

  <div class="f2" style="margin-top:14px">
    <div class="f"><label>с</label><input type="date" value="${from}" onchange="leadFrom=this.value;render()"></div>
    <div class="f"><label>по</label><input type="date" value="${to}" onchange="leadTo=this.value;render()"></div>
  </div>
  <div class="meter">
    <div class="day"><b>Обращения</b><span class="xs">${human(from)} — ${human(to)}</span></div>
    <div class="gauges">
      <div class="gauge"><div class="v">${list.length}</div><div class="k">всего</div></div>
      <div class="gauge acc"><div class="v">${won}</div><div class="k">записались</div></div>
      <div class="gauge"><div class="v">${conv}%</div><div class="k">конверсия</div></div>
    </div>
  </div>

  ${list.length?`
  <div class="sect"><h2>Откуда пришли</h2></div><div class="card">${block(bySrc,true)}</div>
  <div class="sect"><h2>Что спрашивают</h2></div><div class="card">${block(bySrv,true)}</div>
  <div class="sect"><h2>Чем кончилось</h2></div><div class="card">${block(byRes,false)}</div>`:''}

  <div class="sect"><h2>Журнал</h2><span class="act" onclick="leadForm()">+ подробно</span></div>
  <div class="list">${list.length?list.slice(0,60).map(l=>`
    <div class="lrow" onclick="leadForm('${l.id}')">
      <div class="lt">${esc(l.time||'')}</div>
      <div class="grow nowrap"><b>${esc(l.src)}</b>${l.srv?' · '+esc(l.srv):''}${l.phone?'<div class="sm mut">'+esc(fmtPhone(l.phone))+'</div>':''}</div>
      <span class="tag ${l.res==='Записался'?'ok':(l.res==='Думает'?'':'debt')}">${esc(l.res)}</span>
    </div>`).join('')
    :'<div class="empty"><b>Обращений за период нет</b>Каждый звонок сюда — через месяц будет видно, какая площадка реально кормит</div>'}</div>
  <div style="height:20px"></div>`;
}

/* ============ деньги ============ */
let moneySub='cash';
function viewMoney(){
  return `<div class="chips" style="margin-top:14px">
    <div class="chip ${moneySub==='cash'?'on':''}" onclick="moneySub='cash';render()">Касса</div>
    <div class="chip ${moneySub==='pay'?'on':''}" onclick="moneySub='pay';render()">Зарплата</div>
  </div>`+(moneySub==='cash'?viewCash():viewPay());
}

/* ============ render ============ */
const TITLES={shift:'Смена',leads:'Заявки',sched:'Записи',money:'Деньги',cli:'Клиенты'};
function render(){
  $('#hTitle').textContent=TITLES[TAB];
  const v={shift:viewShift,leads:viewLeads,sched:viewSched,money:viewMoney,cli:viewCli}[TAB];
  $('#app').innerHTML=v();
  bindChipsAll($('#app'));
  drawNav();
}
function renderSoft(){
  const el=$('#cq');const pos=el?el.selectionStart:0;
  render();
  const n=$('#cq');if(n){n.focus();n.setSelectionRange(pos,pos)}
}
$('#app').addEventListener('click',e=>{
  const j=e.target.closest('[data-o]');if(j)openOrder(j.dataset.o);
});
function moneyPick(){
  openSheet(sheetHead('Что записать')+`
    <button class="btn" onclick="incForm()">Приход</button>
    <button class="btn ghost" style="margin-top:10px" onclick="expForm()">Расход</button>
    <div style="height:16px"></div>`);
}
$('#fab').addEventListener('click',()=>{
  if(TAB==='leads')return leadForm();
  if(TAB==='money')return moneySub==='cash'?moneyPick():orderForm();
  orderForm();
});

let deferredPrompt=null, swReady=false;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;if(LOADED)render()});
window.addEventListener('appinstalled',()=>{deferredPrompt=null;if(LOADED)render()});
function doInstall(){
  if(!deferredPrompt)return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.finally(()=>{deferredPrompt=null;render()});
}
const standalone=()=>window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;

if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  navigator.serviceWorker.register('sw.js').then(()=>{swReady=true}).catch(()=>{});
}
(async()=>{await load();render();})();
</script>
